<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compteur</title>
    <link rel="manifest" href="./manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nothing: {
                            bg: '#000000',
                            card: '#121212',
                            border: '#2A2A2A',
                            red: '#D71921',
                            white: '#FFFFFF',
                            muted: '#8E8E93',
                            accent: '#222222'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #000000;
            color: #FFFFFF;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
        .btn-active:active { transform: scale(0.96); opacity: 0.9; }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col justify-between max-w-md mx-auto border-x border-nothing-border shadow-2xl relative">

    <header class="p-5 pt-8 bg-black sticky top-0 z-20 border-b border-nothing-border">
        <div class="flex justify-between items-center mb-1">
            <div class="flex items-center gap-2">
                <span id="walletLabel" class="text-xs uppercase tracking-widest text-nothing-muted font-mono">Mon Solde (EUR)</span>
                <span class="inline-block w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
            </div>
            
            <div class="relative">
                <button type="button" onclick="toggleWalletMenu()" class="p-1.5 text-nothing-muted hover:text-white rounded-lg hover:bg-nothing-card transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </button>
                <div id="walletMenu" class="hidden absolute right-0 mt-2 w-48 bg-nothing-card border border-nothing-border rounded-xl shadow-2xl py-1 z-30 font-mono text-xs">
                    <div class="px-3 py-1.5 text-[10px] text-nothing-muted uppercase border-b border-nothing-border">Changer de portefeuille</div>
                    <button type="button" onclick="selectWallet('EUR')" class="w-full text-left px-4 py-2.5 hover:bg-nothing-border flex justify-between items-center transition-colors">
                        <span>Euro (€)</span>
                        <span id="check-eur" class="text-white font-bold">✓</span>
                    </button>
                    <button type="button" onclick="selectWallet('TND')" class="w-full text-left px-4 py-2.5 hover:bg-nothing-border flex justify-between items-center transition-colors">
                        <span>Dinar (DT)</span>
                        <span id="check-tnd" class="text-white font-bold hidden">✓</span>
                    </button>
                </div>
            </div>
        </div>
        <div id="totalBalance" class="text-4xl font-extrabold tracking-tight font-mono text-white">
            0,00 €
        </div>
    </header>

    <main class="flex-1 p-5 pb-24 overflow-y-auto">
        <section id="tab-add" class="space-y-6">
            <div class="grid grid-cols-2 gap-3 p-1 bg-nothing-card rounded-2xl border border-nothing-border">
                <button type="button" id="btn-expense" onclick="setType('expense')" 
                        class="py-3 font-semibold text-sm rounded-xl transition-all duration-150 btn-active flex items-center justify-center gap-2 bg-nothing-red text-white">
                    <span>—</span> Dépense
                </button>
                <button type="button" id="btn-income" onclick="setType('income')" 
                        class="py-3 font-semibold text-sm rounded-xl transition-all duration-150 btn-active flex items-center justify-center gap-2 bg-transparent text-nothing-muted">
                    <span>+</span> Gain
                </button>
            </div>

            <div class="space-y-2">
                <label for="amount" id="amountLabel" class="block text-xs uppercase tracking-widest text-nothing-muted font-mono">Montant (€)</label>
                <div class="relative">
                    <input type="number" id="amount" step="0.01" inputmode="decimal" placeholder="0,00" 
                           class="w-full bg-nothing-card border border-nothing-border rounded-2xl p-4 text-3xl font-mono text-white focus:outline-none focus:border-white transition-colors" />
                    <span id="currencySymbol" class="absolute right-4 top-1/2 -translate-y-1/2 text-xl font-mono text-nothing-muted">€</span>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-xs uppercase tracking-widest text-nothing-muted font-mono">Catégorie / Raison</label>
                <div class="grid grid-cols-2 gap-2" id="categories-grid"></div>
            </div>

            <button type="button" onclick="submitTransaction()" 
                    class="w-full py-4 bg-white text-black font-extrabold text-base rounded-2xl border border-white btn-active shadow-lg transition-all mt-4 uppercase tracking-wider">
                Enregistrer
            </button>

            <div id="toast" class="hidden text-center text-xs text-emerald-400 font-mono py-2 bg-emerald-950/40 rounded-xl border border-emerald-900/50">
                Transaction enregistrée avec succès !
            </div>
        </section>

        <section id="tab-history" class="hidden space-y-5">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-nothing-card p-4 rounded-2xl border border-nothing-border">
                    <span class="block text-[10px] uppercase tracking-wider text-nothing-muted font-mono">Total Gains</span>
                    <span id="stat-gains" class="text-lg font-bold font-mono text-emerald-400">+0,00 €</span>
                </div>
                <div class="bg-nothing-card p-4 rounded-2xl border border-nothing-border">
                    <span class="block text-[10px] uppercase tracking-wider text-nothing-muted font-mono">Total Dépenses</span>
                    <span id="stat-expenses" class="text-lg font-bold font-mono text-nothing-red">-0,00 €</span>
                </div>
            </div>

            <div class="flex justify-between items-center pt-2">
                <h2 class="text-xs uppercase tracking-widest text-nothing-muted font-mono">Historique des transactions</h2>
                <button onclick="confirmClearAll()" class="text-xs text-nothing-muted hover:text-nothing-red transition-colors underline font-mono">
                    Tout effacer
                </button>
            </div>

            <div id="history-list" class="space-y-2"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-black/90 backdrop-blur-md border-t border-nothing-border p-2 px-6 flex justify-around z-30">
        <button id="nav-add" onclick="switchTab('add')" class="flex-1 py-3 flex flex-col items-center gap-1 text-white transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span class="text-[11px] font-mono tracking-wider">Ajouter</span>
        </button>
        <div class="w-px bg-nothing-border my-2"></div>
        <button id="nav-history" onclick="switchTab('history')" class="flex-1 py-3 flex flex-col items-center gap-1 text-nothing-muted transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            <span class="text-[11px] font-mono tracking-wider">Historique</span>
        </button>
    </nav>
