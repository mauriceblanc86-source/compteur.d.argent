<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fond noir complet avec marge de sécurité interne (safe zone) -->
  <rect width="512" height="512" fill="#000000" />
  
  <g transform="translate(106, 106)">
    <!-- Contour de caisse enregistreuse / compteur minimaliste (300x300) -->
    
    <!-- Écran / Affichage supérieur -->
    <rect x="50" y="20" width="200" height="70" rx="12" fill="#121212" stroke="#FFFFFF" stroke-width="8" />
    <!-- Voyant lumineux Nothing red -->
    <circle cx="225" cy="55" r="7" fill="#D71921" />
    
    <!-- Corps principal -->
    <rect x="30" y="110" width="240" height="110" rx="16" fill="#121212" stroke="#FFFFFF" stroke-width="8" />
    
    <!-- Grille de touches minimaliste (style matrix/dot) -->
    <circle cx="75" cy="145" r="8" fill="#FFFFFF" />
    <circle cx="115" cy="145" r="8" fill="#FFFFFF" />
    <circle cx="155" cy="145" r="8" fill="#FFFFFF" />
    <circle cx="195" cy="145" r="8" fill="#FFFFFF" />
    <circle cx="225" cy="145" r="8" fill="#FFFFFF" />
    
    <circle cx="75" cy="185" r="8" fill="#FFFFFF" />
    <circle cx="115" cy="185" r="8" fill="#FFFFFF" />
    <circle cx="155" cy="185" r="8" fill="#FFFFFF" />
    <circle cx="195" cy="185" r="8" fill="#FFFFFF" />
    <circle cx="225" cy="185" r="8" fill="#FFFFFF" />

    <!-- Tiroir caisse inférieur -->
    <rect x="20" y="235" width="260" height="45" rx="10" fill="#000000" stroke="#FFFFFF" stroke-width="8" />
    <!-- Ligne de serrure centrale -->
    <line x1="130" y1="257" x2="170" y2="257" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
